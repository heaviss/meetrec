[flake8]
format = wemake
max-line-length = 120
# W503 contradicts ruff format, which breaks lines before binary operators.
extend-ignore = W503
per-file-ignores =
    # Tests spell out their sample data inline.
    tests/*.py: WPS432, WPS226
    # Meeting is the one module that moves a meeting between statuses: a method per transition.
    meetrec/meeting.py: WPS214
# Defaults sized for library code; a daemon root object and short pipeline modules need a bit more.
max-line-complexity = 20
max-methods = 10
max-module-members = 9
max-attributes = 10

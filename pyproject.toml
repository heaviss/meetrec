[project]
name = "meetrec"
version = "0.1.0"
description = "Record, transcribe and summarize calls locally on Linux"
requires-python = ">=3.14"
dependencies = ["transcribe-cpp==0.4.1", "transcribe-cpp-native==0.4.1"]

[project.scripts]
meetrec = "meetrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

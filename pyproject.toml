[project]
name = "meetrec"
version = "0.1.0"
description = "Record, transcribe and summarize calls locally on Linux"
requires-python = ">=3.14"
dependencies = ["transcribe-cpp==0.4.1", "transcribe-cpp-native==0.4.1"]

[project.scripts]
meetrec = "meetrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "wemake-python-styleguide>=1.8.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = "transcribe_cpp"
ignore_missing_imports = true
